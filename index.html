<!DOCTYPE html>
<html>
	<head lang="pl">
		<link href="style.css" type="text/css" rel="stylesheet" />
		<meta charset="UTF-8" />

	</head>
	<body>

			<header>
				<h1>
					Ant 5P1T

					Umiejetnosci
				</p>

					<li> Znajomość języka polskiego i angielskiego </li>

				<formrow>

				<textarea name="message">
				</textarea>
				</formrow>

			</form>
